# -----------------------------------------------------------------------
# AUTH CONFIG TEMPLATE — copy this file to auth_config.yaml and edit it.
# auth_config.yaml is in .gitignore on purpose: real subscriber credentials
# should never be committed to git, even to a private repo.
#
# HOW TO ADD A REAL USER:
#   1. Run:  python app/utils/hash_password.py "TheirChosenPassword"
#   2. Copy the printed hash into a new entry below under usernames.
#   3. Never store the plaintext password anywhere once it's hashed.
#
# roles: "admin" unlocks internal/debug tooling. "subscriber" is a paying
# customer. Add more roles later (e.g. "trial") if you want tiered access.
#
# ON RENDER: don't ship auth_config.yaml in the repo at all. Use Render's
# "Secret Files" feature to mount this file directly onto the server's
# persistent disk at deploy time, at the path app/auth_config.yaml — that
# way credentials never touch git or your public repo history.
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# WHY THERE ARE NO REAL VALUES BELOW ANY MORE
#
# This file used to ship a working cookie `key:` and working bcrypt
# hashes. On 2026-08-05 the live config was found to be carrying THE
# SAME cookie key as this template — copied across and never rotated,
# because a plausible-looking value does not look like something you
# still have to do.
#
# That key signs the session cookie. Anyone holding it can forge a
# session for any username and role, admin included, without a
# password. It defeats the login without going through it, and this
# file is in a public repo.
#
# So every secret here is now an obvious placeholder. If a value in
# this file ever looks usable again, that is the bug.
# -----------------------------------------------------------------------
credentials:
  usernames:
    admin:
      email: admin@loscappers.com
      name: Admin
      # DEMO password: ChangeMe_Admin123!  — rotate before going live
      password: REPLACE_ME__run_hash_password.py
      role: admin
    demo_subscriber:
      email: demo@loscappers.com
      name: Demo Subscriber
      # DEMO password: ChangeMe_Sub123!  — rotate before going live
      password: REPLACE_ME__run_hash_password.py
      role: subscriber

cookie:
  name: los_cappers_auth
  # Generate your own with: python -c "import secrets; print(secrets.token_hex(32))"
  key: REPLACE_ME__run_the_command_above
  expiry_days: 7
