name: NHL prior PP minutes

# Manual, run ONCE (10-09). Re-reads every 2025-26 regular-season box
# score and writes ONLY data/nhl/prior_pp.json — each skater's power-play
# minutes per game — leaving prior_season.json and every number fitted on
# it untouched (nhl_prior_season.py --pp-only). The nightly then tests the
# PP-weighted ice-time factor on last season (engines/nhl_model.fit_pp)
# and puts it in the chance only if it beats plain ice time.
#
# Read the [verify] line: PP minutes should be on nearly every one of the
# ~47,000 skater-games. ~1,300 box scores: allow 30-60 minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -c requirements.txt requests
      - name: Collect 2025-26 PP minutes from ESPN
        run: python nhl_prior_season.py --pp-only
      - name: Commit the PP minutes file
        run: |
          if [ -z "$(git status --porcelain -- data/nhl/prior_pp.json)" ]; then
            echo "No change to the PP minutes file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nhl/prior_pp.json
          git commit -m "chore: NHL 2025-26 PP minutes for the model [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
