name: Slate Picks (calibration)

# Records the day's board picks so calibration no longer depends on
# someone opening the site. See calibration_picks.py for the full why.
#
# TIMING: MLB posts confirmed lineups 1-3 hours before first pitch, so
# the 6 AM nightly data job is far too early to see a real board. These
# runs straddle the slate instead:
#   14:35 UTC = 10:35 AM ET - earliest getaway/day games (12:05-12:35 ET)
#   15:35 UTC = 11:35 AM ET - the rest of an early slate's lineups
#   17:05 UTC =  1:05 PM ET - afternoon starts
#   21:05 UTC =  5:05 PM ET - most evening lineups are posted
#   23:05 UTC =  7:05 PM ET - late/West Coast starts
#
# THE TWO MORNING RUNS EXIST FOR A SLATE THAT STARTS BEFORE 1 PM.
#
# The old first run was 17:00 UTC. On a 12:35 PM ET first pitch that is
# twenty-five minutes AFTER the slate has already started, so the first
# board of the day was recorded against games in progress — and the
# lineups it needed had been posted since roughly 9:35 AM, four hours
# earlier. There was no run in that entire window. A getaway day slate
# was, in practice, never recorded before it began.
#
# NOTHING BELOW :05 IS A ROUNDING CHOICE.
#
# Every cron in this repo used to sit on the hour. The top of the hour is
# the single most contended minute on GitHub's scheduler, and scheduled
# workflows are queued, not guaranteed — a run booked for "0 17" commonly
# starts 15-45 minutes late. So the 1 PM run was really a 1:20-1:40 PM
# run, which is how a job scheduled 25 minutes after first pitch became a
# job scheduled an hour after it. Odd minutes are materially less
# contended. This costs nothing and is the larger half of the fix.
#
# SAFE TO ADD EARLY RUNS — this was checked, not assumed. An early board
# built off two confirmed lineups does NOT freeze the day: see the
# "REPLACE ONLY WITH AT LEAST AS MUCH BOARD" rule in calibration_picks.py
# (`len(rows) >= len(existing["picks"])`). A later run seeing more
# confirmed lineups replaces the record, and a DEGRADED later run cannot
# destroy a good one. Without that guard these two runs would have
# recreated the 2026-08-12 incident documented there, where hr_edge
# graded four picks on a fifteen-game slate because it froze at lunchtime.
#
# IF YOU MOVE THE FIRST CRON, MOVE _FIRST_BUILD_HOUR TOO.
# app/engines/slate_guard.py duplicates the first entry here as an int so
# Home can say "no board yet" instead of "the job is broken" during the
# hours before it runs. tests/test_slate_guard.py reads the FIRST cron in
# this file and fails if the constant hasn't followed it, so the order of
# these lines is load-bearing: earliest first.
on:
  schedule:
    - cron: "35 14 * * *"
    - cron: "35 15 * * *"
    - cron: "5 17 * * *"
    - cron: "5 21 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write        # commits the pick record back to the repo

# Never let two runs race each other into a commit conflict.
concurrency:
  group: slate-picks
  cancel-in-progress: false

jobs:
  log-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # streamlit is required: the board engines are decorated with
      # @st.cache_data. The decorators work fine outside a Streamlit
      # runtime, but the import has to resolve.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The engines read the precomputed parquets the nightly job
      # publishes. Without this they'd fall back to live per-player
      # Statcast pulls, which would be slow and would not match what the
      # site shows.
      - name: Fetch nightly data archive
        run: python app/fetch_data.py

      - name: Log today's picks
        run: python calibration_picks.py

      # EVERY rated bat, not just the top 5 that publish. Separate file,
      # separate script, nothing on the site changes — see
      # hr_research_log.py for why the top-5-only record cannot answer
      # whether an 88 HR Edge beats a 71.
      #
      # `|| echo` on purpose, unlike the grader in nightly-data. This is
      # a research log: a night missing from it is a gap in a dataset,
      # not a wrong number on a page, and it must never cost the pick
      # record above by failing the job after it has already run.
      - name: Log every rated bat (HR research)
        run: python hr_research_log.py log || echo "hr_research log failed - continuing"

      - name: Commit the pick record and the MLB slate
        run: |
          # git status --porcelain, NOT git diff.
          #
          # git diff only compares TRACKED files. data/calibration.json
          # did not exist in the repo yet, so on every run it was a new
          # UNTRACKED file, git diff reported no changes, and this step
          # exited 0 with "No new picks to commit" — while the log line
          # directly above it said the picks had just been written.
          # Silent, green, and the reason the record never grew past the
          # one day that came from a page view.
          #
          # data/mlb/games.json rides along for the same reason it is
          # written at all: Render gets the repository in its checkout but
          # only gets app/data/ from the nightly release archive, and this
          # job publishes no archive. Uncommitted, the slate would live on
          # this runner and die with it, and Home's hero card would never
          # once see the file the log says was just written.
          PATHS="data/calibration.json data/mlb/games.json data/hr_research"
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "chore: log slate picks and MLB slate [skip ci]"
          # Another scheduled run may have pushed since checkout; rebase
          # rather than fail, so a race costs a retry and not a day.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # WITHOUT THIS THE RECORD NEVER REACHES THE SITE.
      #
      # This job commits the pick record and games.json, and until
      # 2026-08-20 that was enough: Render auto-deployed on every push,
      # so the commit above WAS the delivery. Auto-Deploy is now off (it
      # was rebuilding the service on every data commit, several times a
      # day, for no reason), which means a push no longer ships
      # anything. The board would have recorded five times a day into a
      # repo the live site never re-read.
      #
      # Silent, too: every step would stay green and Home would just
      # keep showing an older board. That is the shape of failure this
      # repo keeps finding, so it gets a step of its own rather than an
      # assumption.
      #
      # Same retry-and-warn as nightly-data: three attempts, then a
      # WARNING rather than a red X, because by this point the pick
      # record is already committed and safe in git. A failed deploy
      # delays delivery; it does not lose the record, and the next run a
      # few hours later ships it.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set - skipping deploy trigger."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$HOOK" >/dev/null; then
              echo "Render deploy triggered (attempt $attempt)."
              exit 0
            fi
            echo "Deploy hook failed on attempt $attempt."
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::warning::Render deploy hook failed 3 times. THE PICK RECORD IS ALREADY COMMITTED - nothing is lost, the site just has not picked it up yet. Trigger a Manual Deploy, or wait for the next scheduled run."
