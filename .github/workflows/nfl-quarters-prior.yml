name: NFL prior quarters

# Manual, run ONCE (10-22). Every 2025 NFL game's drives from ESPN ->
# data/nfl/prior_quarters.json: each quarter's points per team and every
# player's passing / rushing / receiving line by quarter, read from the
# play text and checked against his own box score (nfl_quarters_prior.py,
# engines/nfl_quarters). The quarter / half lines and the 1st-quarter /
# 1st-half player props are fitted and tested on it. Committed once.
#
# Read the [verify] lines: ~272 games, a player named in 95%+ of run /
# pass plays, rushing and receiving yards adding up for 90%+ of players.
# Allow 15-30 minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -c requirements.txt requests
      - name: Collect NFL prior quarters from ESPN
        run: python nfl_quarters_prior.py
      - name: Commit the file
        run: |
          if [ -z "$(git status --porcelain -- data/nfl/prior_quarters.json)" ]; then
            echo "No change to data/nfl/prior_quarters.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl/prior_quarters.json
          git commit -m "chore: NFL 2025 quarters for quarter lines and 1Q / 1H props [skip ci]"
          # retry: a push that lands while another run (or a manual push) moved
          # main is turned away ("cannot lock ref") - pull again and retry
          for _try in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            if [ "$_try" = 5 ]; then echo "::error::push failed 5 times"; exit 1; fi
            sleep $((_try * 15))
          done
