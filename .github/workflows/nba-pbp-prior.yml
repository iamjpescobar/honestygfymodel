name: NBA prior play-by-play

# Manual, run ONCE (10-21). Every 2025-26 NBA game's play-by-play from
# ESPN -> data/nba/prior_pbp.json: the tip, the first field goal, each
# quarter's score, starters, each player's points per quarter. The First
# Basket page and the quarter / half lines are fitted and tested on it
# (nba_pbp_prior.py, engines/nba_pbp). Last season does not change, so
# the file is committed and never re-fetched.
#
# Read the [verify] lines: ~1,230 games, each piece read in 95%+ of them,
# 0 quarter lines that don't add up, a first-basket leader you'd expect.
# Allow 30-60 minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -c requirements.txt requests
      - name: Collect 2025-26 NBA play-by-play from ESPN
        run: python nba_pbp_prior.py
      - name: Commit the prior play-by-play
        run: |
          if [ -z "$(git status --porcelain -- data/nba/prior_pbp.json)" ]; then
            echo "No change to the NBA prior play-by-play file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba/prior_pbp.json
          git commit -m "chore: NBA 2025-26 play-by-play for first basket and quarters [skip ci]"
          # retry: a push that lands while another run (or a manual push) moved
          # main is turned away ("cannot lock ref") - pull again and retry
          for _try in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            if [ "$_try" = 5 ]; then echo "::error::push failed 5 times"; exit 1; fi
            sleep $((_try * 15))
          done
