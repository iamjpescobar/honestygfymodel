name: NBA prior season

# Manual, run ONCE (10-20). Every 2025-26 NBA regular-season box score
# from ESPN -> data/nba/prior_season.json, which the NBA model is fitted
# and TESTED on (nba_prior_season.py, engines/nba_model). Last season
# does not change, so the file is committed and never re-fetched.
#
# Read the [verify] lines: ~1,230 finals, ~1,230 box scores, ~550
# players, ~27,000 player-games, the scoring leader. Allow 30-60 minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -c requirements.txt requests
      - name: Collect 2025-26 NBA box scores from ESPN
        run: python nba_prior_season.py
      - name: Commit the prior season
        run: |
          if [ -z "$(git status --porcelain -- data/nba/prior_season.json)" ]; then
            echo "No change to the NBA prior season file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba/prior_season.json
          git commit -m "chore: NBA 2025-26 season for the model [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
