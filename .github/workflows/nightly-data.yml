name: Nightly Statcast Data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6:00 AM ET — MLB refresh after all games final
    - cron: "0 8 * * *"    # 08:00 UTC = 5:00 PM JST/KST — pre-game international refresh (postponement calls)
    - cron: "0 22 * * *"   # 22:00 UTC = 6:00 PM ET — pre-slate WNBA/NBA refresh so evening slates get same-day data
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to publish the release asset

# Never let two runs race each other into a commit conflict.
#
# A manual dispatch and a cron can overlap. Most of this job survives
# that — the release publish is upload-then-clobber, and grade() skips
# any pick already marked hit/miss/dnp, so grading twice cannot
# double-count. The step that does NOT survive it is "Commit graded
# calibration record": both runs write data/calibration.json, commit
# it, then git pull --rebase, and whichever lands second rebases onto
# the first's commit to the same file and can conflict — turning a
# healthy run red for no real reason.
#
# cancel-in-progress is FALSE on purpose. The Statcast fetch is ~15
# minutes; killing one mid-flight is worse than making the second wait.
#
# THE GROUP NAME IS SHARED WITH intl-late-refresh (2026-08-06). Both
# workflows republish the same release asset, and the old name scoped
# this guard to the nightly alone — so it protected the nightly from
# itself and did nothing about the refresh overwriting it. Named after
# the RESOURCE now, so anything else that republishes the archive joins
# by using the same string.
concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Installs from requirements.txt, same as slate-picks.yml and same
      # as production. This step used to be a hand-written
      # `pip install pybaseball pandas pyarrow requests lxml` — a
      # DIFFERENT and unpinned set from the one the app actually runs, so
      # the nightly job could build an archive with a pandas that
      # production never sees. The whole point of the "Run tests" gate
      # below is to catch breakage before the 15-minute fetch, and it
      # can't do that while it's testing against different versions.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prints the resolved versions into the run log. Anything in
      # requirements.txt without a pin is resolved fresh here every
      # night, so when a run breaks for no apparent reason this is the
      # record of what actually changed underneath it. Use this output to
      # fill in the missing pins (see requirements.txt).
      - name: Record resolved dependency versions
        run: pip freeze

      # Runs BEFORE the fetch on purpose. The Statcast pull takes ~15
      # minutes and half a million pitches, and twice now a defect in
      # precompute.py has crashed the run only AFTER all of that work
      # completed — once on a missing numpy import, once on pd.NA
      # surviving a boolean mask. Both were catchable in seconds.
      #
      # Fails the job immediately, so a broken build never burns the
      # fetch and never publishes a bad archive.
      - name: Run tests
        run: |
          failed=0
          for t in tests/*.py; do
            echo "--- $t"
            python "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Tests failed - refusing to fetch data or publish an archive."
            exit 1
          fi

      # Grading runs BEFORE the Statcast fetch and as its OWN step.
      #
      # It used to be a line at the bottom of precompute.py wrapped in a
      # bare except, which meant (a) any failure was swallowed silently
      # with the job still green, and (b) any crash during the ~15-minute
      # fetch meant grading never ran at all that day. Grading needs
      # nothing from the fetch — just the logged picks and MLB's box
      # scores — so it has no business being downstream of it.
      #
      # No `|| echo` here on purpose. Unlike the international slates,
      # which are genuinely optional, a broken grader is exactly the kind
      # of thing that must go red instead of quietly skipping days.
      # build_data/ is never wiped, so the record written here is still
      # present for precompute.py to pack into the archive below.
      # NO TEST MAY LEAVE A TRACKED FILE CHANGED. 2026-10-03 a test that
      # rewrote data/mlb/games.json made a later `git pull --autostash`
      # conflict, and the next commit step died on an unmerged file —
      # after the models were built and before anything was published.
      # The leak is fixed at the test; this step makes any future one
      # VISIBLE (warning + the list) and harmless (restored) before the
      # first commit step. Only tests have run at this point, so nothing
      # here is real work to keep. tests/test_ci_hygiene.py pins it.
      - name: Restore any tracked files the tests touched
        run: |
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "::warning::Tests modified tracked files - restoring them before any commit:"
            echo "$changed"
            git checkout -- .
          fi
          # NEW files a test created under data/ (2026-10-03: a test made
          # data/model_picks/mlb.json, which add/add-conflicted with the
          # real one). Removed by explicit path — never `git clean` in this
          # repo (standing rule 7). Only data/, and only untracked files.
          leaked="$(git ls-files --others --exclude-standard -- data)"
          if [ -n "$leaked" ]; then
            echo "::warning::Tests created files under data/ - removing them before any commit:"
            echo "$leaked"
            git ls-files -z --others --exclude-standard -- data | xargs -0 -r rm -f --
          fi
          if [ -z "$changed" ] && [ -z "$leaked" ]; then
            echo "Tests left the working tree clean."
          fi
      - name: Grade calibration picks
        run: python calibration_pipeline.py

      # Committed immediately, before the fetch can fail the job. The
      # graded record is the one artifact here that cannot be
      # regenerated — if it isn't committed it's gone.
      - name: Commit graded calibration record
        run: |
          # git status --porcelain, NOT git diff: git diff ignores
          # untracked files, so a first-time data/calibration.json
          # reports clean and the graded record is never committed.
          if [ -z "$(git status --porcelain -- data/calibration.json)" ]; then
            echo "No calibration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibration.json
          git commit -m "chore: grade calibration picks [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # The game models' value picks, graded against real finals, before
      # any fetch (same reasoning as the calibration grader above).
      - name: Grade model picks
        # NHL and NFL only: MLB picks are logged AND graded by slate-picks.
        # One owner per file (see model_picks_grade.main).
        run: python model_picks_grade.py nhl nfl || echo "::warning::model picks grading failed - left pending for tomorrow"
      - name: Commit graded model picks
        run: |
          if [ -z "$(git status --porcelain -- data/model_picks/nhl.json data/model_picks/nfl.json)" ]; then
            echo "No model-pick changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_picks/nhl.json data/model_picks/nfl.json 2>/dev/null || true
          git commit -m "chore: grade model picks [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fetch NPB slate (real npb.jp data)
        run: python npb_precompute.py || echo "NPB fetch failed - continuing without it"

      - name: Fetch KBO slate (real MyKBOStats data)
        run: python kbo_precompute.py || echo "KBO fetch failed - continuing without it"

      - name: Fetch WNBA slate (real ESPN data)
        run: python wnba_precompute.py || echo "WNBA fetch failed - continuing without it"

      # NFL is a WEEK file (Tuesday-Monday); the 10:00 UTC run on Tuesday
      # is the one that rolls it to the new week. Tolerant like every
      # league fetch: one league down must not cost the others.
      - name: Fetch NFL week (real ESPN data)
        run: python nfl_precompute.py || echo "NFL fetch failed - continuing without it"

      # NHL looks ahead to the next date with games, so through the
      # preseason gap it still publishes a real (exhibition) slate.
      - name: Fetch NHL slate (real ESPN data)
        run: python nhl_precompute.py || echo "NHL fetch failed - continuing without it"

      # Who actually starts, from MLB's own posted lineups. Feeds the
      # projected-lineup caption on the Game Card, which is what a
      # morning read has instead of a real lineup.
      #
      # Tolerant like the league fetches above: a failed run leaves
      # yesterday's file in place and the caption keeps working off it,
      # which is far better than failing the nightly over a decoration.
      - name: Build lineup lock rates (real MLB boxscores)
        run: python lineup_lock_precompute.py || echo "Lineup lock build failed - continuing without it"

      # The projection log is a RECORD, written to the repo by
      # nfl_precompute for the same reason calibration.json is: a file
      # written into build_data/ is rebuilt from scratch every run and
      # only ever leaves as the tarball, so it cannot accumulate. This
      # is what a future grader reads to score what the board actually
      # claimed, and it is worthless unless it is committed the day it
      # is written.
      # MLB game model: fitted on the season's real finals + starter game
      # logs, walk-forward validated, written to data/mlb/model.json and
      # committed (like lineup_lock.json) so the slate builder in
      # slate-picks.yml can read it too. A failure costs the model, never
      # the rest of the nightly.
      - name: Build MLB game model (real statsapi finals)
        run: python mlb_model_precompute.py || echo "::warning::MLB model build failed - continuing without it"
      - name: Commit MLB game model
        run: |
          if [ -z "$(git status --porcelain -- data/mlb/model.json data/mlb/prior_season.json)" ]; then
            echo "No MLB model changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/model.json
          # Last season (finals, starters, player counts) — written once,
          # the first night it is missing (mlb_model_precompute).
          if [ -f data/mlb/prior_season.json ]; then git add data/mlb/prior_season.json; fi
          git commit -m "chore: refit MLB game model [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Commit NFL projection log
        run: |
          # --porcelain, not git diff: a brand-new dated file is
          # untracked, and git diff reports untracked as no change.
          if [ -z "$(git status --porcelain -- data/nfl/projections data/nfl/prior_season.json data/nfl/prior_players.json data/nfl/prior_dvp.json data/model_picks/nhl.json data/model_picks/nfl.json data/top_plays/nhl.json data/top_plays/nhl_potd.json data/top_plays/nhl_multigoal.json data/top_plays/nhl_multigoal_ranks.json)" ]; then
            echo "No new NFL projections to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/nfl/projections
            # The 2025 finals the game model fits on — written once, the
            # first night it is missing (nfl_prior_season.py).
            if [ -f data/nfl/prior_season.json ]; then git add data/nfl/prior_season.json; fi
            # Every 2025 player's box-score totals — also written once.
            if [ -f data/nfl/prior_players.json ]; then git add data/nfl/prior_players.json; fi
            # Every 2025 player-game line the defense-vs-position table reads
            # (nfl_prop_check) — also written once.
            if [ -f data/nfl/prior_dvp.json ]; then git add data/nfl/prior_dvp.json; fi
            # NHL and NFL value picks are logged during their fetch steps.
            # (NHL/NFL only — data/model_picks/mlb.json belongs to slate-picks.)
            # NHL top plays: logged and graded by nhl_precompute (this job
            # owns nhl.json; slate-picks owns mlb.json).
            # NHL Player of the Day, the multi-goal watch and its pre-game
            # rank snapshots (10-09) — same owner, same step.
            for f in data/model_picks/nhl.json data/model_picks/nfl.json data/top_plays/nhl.json \
                     data/top_plays/nhl_potd.json data/top_plays/nhl_multigoal.json \
                     data/top_plays/nhl_multigoal_ranks.json; do
              if [ -f "$f" ]; then git add "$f"; fi
            done
            git commit -m "chore: log NFL projections [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Commit lineup lock rates
        run: |
          # --porcelain, not git diff: an untracked first-time file
          # reports clean under git diff and never gets committed. That
          # exact mistake is documented on the calibration step above.
          if [ -z "$(git status --porcelain -- data/mlb/lineup_lock.json)" ]; then
            echo "No lineup lock changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mlb/lineup_lock.json
          git commit -m "chore: rebuild lineup lock rates [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fetch and package real Statcast data
        run: python precompute.py

      # AFTER precompute, NOT beside the calibration grader above.
      #
      # This grades off app/data/statcast/batters/{id}.parquet, and those
      # files only contain last night's games once precompute has run.
      # Placed next to "Grade calibration picks" it would read yesterday's
      # files every time, find almost no bat appearing on the date it was
      # grading, correctly refuse to close the night — and stay one day
      # behind forever while reporting nothing wrong.
      - name: Grade the HR research log
        run: python hr_research_log.py grade || echo "hr_research grade failed - continuing"

      - name: Commit the graded HR research log
        run: |
          # Same porcelain-not-diff reason as every other commit step in
          # this repo: data/hr_research/ starts untracked, and git diff
          # reports an untracked file as no change.
          if [ -z "$(git status --porcelain -- data/hr_research)" ]; then
            echo "No HR research changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hr_research
          git commit -m "chore: grade HR research log [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # DO NOT PUBLISH A PARTIAL ARCHIVE.
      #
      # The three slate fetches above end in `|| echo "... continuing
      # without it"`, which is right — one league's site being down must
      # not cost the other four. But the packaging step downstream had no
      # idea any of it had failed, so a failed WNBA fetch produced a
      # tarball with no data/wnba/ in it, and the publish step below
      # deleted the last good release BEFORE uploading the new one.
      #
      # The result was total, silent, and unrecoverable: app/data/wnba/
      # simply did not exist on the deployed instance, every WNBA view
      # fell through to its "engine is being connected" placeholder, and
      # yesterday's working archive had already been destroyed.
      #
      # This checks what actually went into the tarball. Statcast is
      # required — without it there is no MLB product and publishing is
      # pointless. The international slates are warned about but allowed
      # through, because a real league break (FIBA, KBO All-Star) is
      # indistinguishable here from a fetch failure, and refusing to ship
      # MLB data during a WNBA off-week would be its own outage.
      - name: Verify the archive before publishing
        run: |
          python3 - <<'PY'
          import sys, tarfile
          names = set()
          with tarfile.open("statcast_data.tar.gz", "r:gz") as tar:
              for n in tar.getnames():
                  names.add(n.strip("./"))

          def has(prefix):
              return any(n.startswith(prefix) for n in names)

          required = {"data/statcast/manifest.json": "Statcast manifest"}
          expected = {"data/wnba/games.json": "WNBA slate",
                      "data/kbo/games.json": "KBO slate",
                      "data/npb/games.json": "NPB slate",
                      "data/nfl/games.json": "NFL week",
                      "data/nhl/games.json": "NHL slate"}

          missing_required = [d for p, d in required.items() if p not in names]
          missing_expected = [d for p, d in expected.items() if p not in names]

          for d in missing_expected:
              print(f"::warning::{d} is missing from the archive - that "
                    f"league's pages will show their placeholder until the "
                    f"next successful run.")

          if missing_required:
              print("::error::Refusing to publish: " +
                    ", ".join(missing_required) + " missing from the "
                    "archive. The existing release is left untouched.")
              sys.exit(1)

          print(f"Archive verified: {len(names)} entries.")
          for p in list(required) + list(expected):
              print(f"  {'present ' if p in names else 'MISSING '} {p}")
          PY

      - name: Publish data as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upload FIRST, delete second. This used to delete the release
          # before creating the new one, so any failure between the two
          # left no archive at all and the site with no data. --clobber
          # replaces the asset in place, so there is never a window
          # without a usable download.
          gh release create nightly-data statcast_data.tar.gz \
            -t "Nightly Statcast Data" \
            -n "Auto-generated nightly. Real Baseball Savant pitch data + NPB slate from npb.jp. See manifest.json inside for fetch timestamp." \
            || gh release upload nightly-data statcast_data.tar.gz --clobber

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # RETRY, AND DO NOT KILL THE JOB OVER A NOTIFICATION.
          #
          # 2026-08-20: this returned HTTP 500, curl -fsS exited 22, and
          # the whole nightly went red — AFTER the tests passed, the
          # archive was built, verified, and successfully uploaded to
          # the release. Everything the job exists to produce existed.
          # The only thing that failed was telling Render about it.
          #
          # A red X on a run that did all its work is the "confident
          # wrong diagnosis" this repo has a standing rule against: it
          # sends whoever sees it to debug a data build that is fine,
          # and it buries a real failure on some future night in a
          # history of noisy ones.
          #
          # 500 is Render's server erroring, not a bad hook — a wrong
          # URL gives 404 — so it is usually transient and a retry
          # clears it. Three attempts, backing off.
          #
          # If all three fail the step WARNS rather than fails. That is
          # deliberate and it is safe here specifically because this step
          # is last: the release asset is already published, so the data
          # is reachable and a human can press Manual Deploy. The
          # annotation says exactly that, so nobody has to reconstruct it.
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set - skipping deploy trigger."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 30 "$HOOK" >/dev/null; then
              echo "Render deploy triggered (attempt $attempt)."
              exit 0
            fi
            echo "Deploy hook failed on attempt $attempt."
            # Written as a full if, not `[ ... ] && sleep`. These steps
            # run under `bash -e`; a bare test that evaluates false on
            # the last pass is a failing command, and relying on the
            # and-list exemption to keep -e quiet is the kind of subtle
            # that breaks when someone reorders two lines.
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::warning::Render deploy hook failed 3 times. THE ARCHIVE IS ALREADY PUBLISHED - the data is fine and reachable. Trigger a Manual Deploy from the Render dashboard to pick it up."
