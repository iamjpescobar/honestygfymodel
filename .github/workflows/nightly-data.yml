name: Nightly Statcast Data

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6:00 AM ET — MLB refresh after all games final
    - cron: "0 8 * * *"    # 08:00 UTC = 5:00 PM JST/KST — pre-game international refresh (postponement calls)
    - cron: "0 22 * * *"   # 22:00 UTC = 6:00 PM ET — pre-slate WNBA/NBA refresh so evening slates get same-day data
  workflow_dispatch: {}     # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to publish the release asset

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installs from requirements.txt, same as slate-picks.yml and same
      # as production. This step used to be a hand-written
      # `pip install pybaseball pandas pyarrow requests lxml` — a
      # DIFFERENT and unpinned set from the one the app actually runs, so
      # the nightly job could build an archive with a pandas that
      # production never sees. The whole point of the "Run tests" gate
      # below is to catch breakage before the 15-minute fetch, and it
      # can't do that while it's testing against different versions.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Prints the resolved versions into the run log. Anything in
      # requirements.txt without a pin is resolved fresh here every
      # night, so when a run breaks for no apparent reason this is the
      # record of what actually changed underneath it. Use this output to
      # fill in the missing pins (see requirements.txt).
      - name: Record resolved dependency versions
        run: pip freeze

      # Runs BEFORE the fetch on purpose. The Statcast pull takes ~15
      # minutes and half a million pitches, and twice now a defect in
      # precompute.py has crashed the run only AFTER all of that work
      # completed — once on a missing numpy import, once on pd.NA
      # surviving a boolean mask. Both were catchable in seconds.
      #
      # Fails the job immediately, so a broken build never burns the
      # fetch and never publishes a bad archive.
      - name: Run tests
        run: |
          failed=0
          for t in tests/*.py; do
            echo "--- $t"
            python "$t" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Tests failed - refusing to fetch data or publish an archive."
            exit 1
          fi

      # Grading runs BEFORE the Statcast fetch and as its OWN step.
      #
      # It used to be a line at the bottom of precompute.py wrapped in a
      # bare except, which meant (a) any failure was swallowed silently
      # with the job still green, and (b) any crash during the ~15-minute
      # fetch meant grading never ran at all that day. Grading needs
      # nothing from the fetch — just the logged picks and MLB's box
      # scores — so it has no business being downstream of it.
      #
      # No `|| echo` here on purpose. Unlike the international slates,
      # which are genuinely optional, a broken grader is exactly the kind
      # of thing that must go red instead of quietly skipping days.
      # build_data/ is never wiped, so the record written here is still
      # present for precompute.py to pack into the archive below.
      - name: Grade calibration picks
        run: python calibration_pipeline.py

      # Committed immediately, before the fetch can fail the job. The
      # graded record is the one artifact here that cannot be
      # regenerated — if it isn't committed it's gone.
      - name: Commit graded calibration record
        run: |
          # git status --porcelain, NOT git diff: git diff ignores
          # untracked files, so a first-time data/calibration.json
          # reports clean and the graded record is never committed.
          if [ -z "$(git status --porcelain -- data/calibration.json)" ]; then
            echo "No calibration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibration.json
          git commit -m "chore: grade calibration picks [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fetch NPB slate (real npb.jp data)
        run: python npb_precompute.py || echo "NPB fetch failed - continuing without it"

      - name: Fetch KBO slate (real MyKBOStats data)
        run: python kbo_precompute.py || echo "KBO fetch failed - continuing without it"

      - name: Fetch WNBA slate (real ESPN data)
        run: python wnba_precompute.py || echo "WNBA fetch failed - continuing without it"

      - name: Fetch and package real Statcast data
        run: python precompute.py

      - name: Publish data as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly-data -y || true
          gh release create nightly-data statcast_data.tar.gz \
            -t "Nightly Statcast Data" \
            -n "Auto-generated nightly. Real Baseball Savant pitch data + NPB slate from npb.jp. See manifest.json inside for fetch timestamp."

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK" && echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK secret not set - skipping deploy trigger."
          fi
