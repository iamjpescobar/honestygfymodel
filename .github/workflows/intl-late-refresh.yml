name: Late slate refresh (KBO, NPB, WNBA)

# WHY THIS EXISTS
#
# The nightly fetches the KBO and NPB slates at 08:00 UTC — 5 PM local,
# roughly ninety minutes before first pitch. A postponement announced
# after that does not reach the site until the following night's run, so
# subscribers were looking at boards for games that had already been
# called off, and betting them. That is where the voids came from.
#
# This re-fetches ONLY the two international slates, close to first
# pitch, and republishes. It does not re-run the Statcast pull: that
# takes fifteen minutes and nothing about it changes in the intervening
# hour. Instead it downloads the archive the nightly already published,
# swaps in the fresh slates, and re-uploads the same asset — a couple of
# minutes of runner time.
#
# WHAT IT DELIBERATELY DOES NOT DO
#
# It never publishes an archive it did not successfully rebuild. If the
# download fails, or either fetch fails, or the repacked tarball is
# missing the Statcast payload, the job stops WITHOUT uploading. The
# nightly's own comments explain why that rule exists: an earlier
# version of the publish step destroyed the last good release before
# uploading the new one, and the failure was total and silent. A stale
# slate is a bad afternoon; a destroyed archive is an outage.

# CONCURRENCY — SHARED WITH THE NIGHTLY, ON PURPOSE.
#
# Both workflows download the SAME published archive, repack it and
# upload it back to the same release asset. Nothing in that sequence is
# atomic, so if two runs overlap the second upload silently replaces the
# first's work. The repack's data/statcast/ check catches an archive
# that is GUTTED; it cannot tell a STALE one from a fresh one.
#
# This nearly happened on 2026-08-06: the nightly was mid-run while a
# late refresh sat queued, and then a GitHub Actions outage left two of
# EACH queued to fire the moment capacity returned. Nothing protected
# the asset but timing.
#
# The group name is deliberately about the RESOURCE, not the workflow —
# anything else that republishes the archive joins this group.
#
# cancel-in-progress is FALSE for the same reason the nightly sets it
# false: a half-finished publish is worse than a delayed one.
concurrency:
  group: publish-archive
  cancel-in-progress: false

on:
  schedule:
    # 09:20 UTC = 18:20 KST / JST. KBO first pitch is typically 18:30
    # local and NPB 18:00, so this lands inside the window where a
    # weather postponement has been announced but the games have not
    # been played. Deliberately ONE extra run rather than several: each
    # one triggers a Render deploy, and on the free tier that means a
    # cold start for whoever is on the site at the time.
    - cron: "20 9 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Only what the two slate builders need. pybaseball, pyarrow and
      # numpy are for the Statcast pull, which this job does not run —
      # installing the full pinned set would add minutes for nothing.
      #
      # But the NAMES are chosen here while the VERSIONS come from
      # requirements.txt via -c (constraints). A hand-written unpinned
      # list is the exact mistake nightly-data.yml documents having made
      # and reverted: it drifts from production, and it silently omitted
      # pandas, which kbo_precompute.py imports at module scope. That
      # killed every run of this job with ModuleNotFoundError before KBO
      # — the league this workflow exists for — ever refreshed.
      - name: Install slate dependencies
        run: pip install -c requirements.txt requests pandas lxml beautifulsoup4

      - name: Download the published archive
        run: |
          set -e
          curl -fsSL -o statcast_data.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly-data/statcast_data.tar.gz"
          mkdir -p build_data
          tar -xzf statcast_data.tar.gz -C build_data
          echo "Extracted archive:"
          ls build_data/data

      # Both write into build_data/data/<league>/, overwriting the
      # nightly's copies in place — the same paths the packaging below
      # reads back.
      # continue-on-error so ONE league's outage cannot take the other
      # down with it. This is safe here and nowhere else in the job:
      # build_data already holds the nightly's copy of both slates, so a
      # failed fetch leaves last night's data in place rather than a
      # hole. Publishing fresh-KBO + nightly-NPB beats publishing
      # nothing. The job is still marked failed at the end — see
      # "Report fetch failures" — so a silent outage stays impossible.
      - name: Re-fetch NPB slate
        id: npb
        continue-on-error: true
        run: python npb_precompute.py

      - name: Re-fetch KBO slate
        id: kbo
        continue-on-error: true
        run: python kbo_precompute.py

      # WNBA HAS NO OTHER WAY BACK.
      #
      # The WNBA slate is built solely inside nightly-data.yml, downstream
      # of the ~15-minute Statcast pull. When the nightly failed on
      # Aug 5 the site showed "No WNBA slate on disk for 2026-08-05" for
      # the rest of the day — slate_guard correctly refusing to pass an
      # older night's games off as tonight's — and there was no way to
      # recover short of a full nightly run. "Sync latest" cannot help
      # either: it re-downloads the same release asset and honestly
      # reports that nothing changed.
      #
      # This job already downloads, swaps, repacks, verifies and
      # publishes. wnba_precompute.py writes to build_data/data/wnba,
      # exactly the convention kbo_precompute and npb_precompute use, and
      # needs nothing the install step does not already provide. So the
      # recovery path costs one step.
      - name: Re-fetch WNBA slate
        id: wnba
        continue-on-error: true
        run: python wnba_precompute.py

      # REBUILD, THEN CHECK, THEN UPLOAD — never the other way round.
      # If NEITHER fetch worked there is nothing new to ship, and
      # republishing would trigger a Render deploy — a cold start on the
      # free tier for whoever is on the site, in exchange for a
      # byte-identical archive.
      # ONE CONDITION, DEFINED ONCE — see the note above "Repack and
      # verify". This used to be spelled out inline on three separate
      # steps, WNBA was accidentally repeated three times in one of them
      # and omitted entirely from the other two, and the omission was
      # invisible because the repeated clause made the block LOOK like it
      # covered everything.
      - name: Decide whether anything is worth publishing
        id: gate
        if: always()
        env:
          NPB_OUTCOME: ${{ steps.npb.outcome }}
          KBO_OUTCOME: ${{ steps.kbo.outcome }}
          WNBA_OUTCOME: ${{ steps.wnba.outcome }}
        run: |
          if [ "$NPB_OUTCOME" = "success" ] || [ "$KBO_OUTCOME" = "success" ] \
             || [ "$WNBA_OUTCOME" = "success" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "At least one slate refreshed - the archive is worth republishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No slate refreshed - nothing new to ship, leaving the release alone."
          fi

      - name: Repack and verify
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -e
          rm -f statcast_data.tar.gz
          tar -czf statcast_data.tar.gz -C build_data .
          python3 - <<'PY'
          import sys, tarfile
          names = {n.strip("./") for n in
                   tarfile.open("statcast_data.tar.gz", "r:gz").getnames()}
          def has(prefix):
              return any(n.startswith(prefix) for n in names)
          # The Statcast payload came from the nightly and this job never
          # touches it. If it is missing, the download or the extract went
          # wrong, and uploading would replace a complete archive with a
          # gutted one.
          if not has("data/statcast/"):
              print("::error::Statcast data missing from the repack — "
                    "refusing to publish and overwrite a good archive.")
              sys.exit(1)
          for lg in ("kbo", "npb", "wnba"):
              print(("present " if has(f"data/{lg}/") else "MISSING ")
                    + f"data/{lg}/")
          print(f"Repacked archive verified: {len(names)} entries.")
          PY

      # THIS IS WHERE THE WNBA RECOVERY PATH WAS SILENTLY DEAD.
      #
      # The step above was extended to include WNBA; this one and the
      # deploy below were not. So on the exact day this workflow exists
      # for - the nightly failed, KBO and NPB are also down or on a
      # break, and WNBA is the league with "NO OTHER WAY BACK" - the job
      # downloaded the archive, refetched the WNBA slate, repacked it,
      # verified it, and then skipped the upload and went green. All the
      # work, none of the recovery, and no red X to say so.
      - name: Publish the refreshed archive
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload nightly-data statcast_data.tar.gz --clobber

      # Render only picks up a new archive on deploy — fetch_data.py runs
      # at build time, not per request — so without this the refreshed
      # slate sits in the release and never reaches anyone.
      - name: Trigger Render deploy
        if: steps.gate.outputs.publish == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS "$HOOK" && echo "Render deploy triggered."
          else
            echo "No RENDER_DEPLOY_HOOK secret set - skipping deploy."
          fi

      # Runs AFTER publishing, on purpose: the good league still ships,
      # and only then does the run go red. continue-on-error alone would
      # leave the job green and the outage invisible.
      - name: Report fetch failures
        if: steps.npb.outcome == 'failure' || steps.kbo.outcome == 'failure'
          || steps.wnba.outcome == 'failure'
        env:
          NPB_OUTCOME: ${{ steps.npb.outcome }}
          KBO_OUTCOME: ${{ steps.kbo.outcome }}
          WNBA_OUTCOME: ${{ steps.wnba.outcome }}
        run: |
          if [ "$NPB_OUTCOME" = "failure" ]; then
            echo "::error::NPB refresh failed - the archive kept the nightly's NPB slate."
          fi
          if [ "$KBO_OUTCOME" = "failure" ]; then
            echo "::error::KBO refresh failed - the archive kept the nightly's KBO slate."
          fi
          if [ "$WNBA_OUTCOME" = "failure" ]; then
            echo "::error::WNBA refresh failed - the archive kept the nightly's WNBA slate."
          fi
          exit 1
